name: Keep Render Server Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend health endpoint
        run: |
          echo "Pinging Render server health check to keep it awake..."
          curl -sS --max-time 60 --retry 3 --retry-delay 5 -f https://water-footprint-analyser.onrender.com/health/ > /dev/null
          echo "Ping successful! Backend is awake."

